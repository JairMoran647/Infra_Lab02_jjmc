version: '3'

services:

  app1:
    container_name: api01
    build: ./api
    ports:
      - "3000:3000"
    environment:
      - MESSAGE= Moran Carbonel Jair compilado 3000


  app2:
    container_name: api02
    build: ./api
    ports:
      - "3001:3000"
    environment:
      - MESSAGE= Moran Carbonel Jair compilado 3001

  app3:
    container_name: api03
    build: ./api
    ports:
      - "3002:3000"
    environment:
      - MESSAGE= Moran Carbonel Jair compilado 3002


  db:
    image: postgres:13
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgrades_data:/var/lib/postgresql/data



volumes:
  postgrades_data: